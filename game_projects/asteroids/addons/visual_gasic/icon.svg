  <text x="128" y="148" font-family="Arial,Helvetica,sans-serif" font-size="110" font-weight="bold" fill="white" text-anchor="middle" dominant-baseline="middle">VG</text>
  <!-- Subtitle -->
  <text x="128" y="210" font-family="Arial,Helvetica,sans-serif" font-size="24" fill="#b8ccff" text-anchor="middle">Visual Gasic</text>
