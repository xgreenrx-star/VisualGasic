<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 260" width="200" height="260">
  <!-- Dark background -->
  <rect width="200" height="260" fill="#0a0f0a"/>

  <!-- Tree: top tier (smallest) -->
  <polygon points="100,18 72,62 128,62" fill="#1a6e3c"/>
  <polygon points="100,18 72,62 128,62" fill="none" stroke="#39ff8a" stroke-width="1.5"/>

  <!-- Tree: middle tier -->
  <polygon points="100,42 58,95 142,95" fill="#1a6e3c"/>
  <polygon points="100,42 58,95 142,95" fill="none" stroke="#39ff8a" stroke-width="1.5"/>

  <!-- Tree: bottom tier (widest) -->
  <polygon points="100,70 42,130 158,130" fill="#1a6e3c"/>
  <polygon points="100,70 42,130 158,130" fill="none" stroke="#39ff8a" stroke-width="1.5"/>

  <!-- Trunk -->
  <rect x="90" y="130" width="20" height="36" fill="#1a6e3c" stroke="#39ff8a" stroke-width="1.2"/>

  <!-- Base platform -->
  <rect x="34" y="166" width="132" height="10" rx="1" fill="#1a3a1a" stroke="#39ff8a" stroke-width="1.5"/>

  <!-- Phosphor glow on peak -->
  <circle cx="100" cy="18" r="2.5" fill="#39ff8a" opacity="0.95"/>

  <!-- Subtle inner glow lines on tiers -->
  <line x1="100" y1="22" x2="100" y2="58" stroke="#39ff8a" stroke-width="0.5" opacity="0.3"/>

  <!-- Text -->
  <text x="100" y="196" font-family="'Courier New', Courier, monospace" font-size="11"
        font-weight="bold" fill="#39ff8a" text-anchor="middle" letter-spacing="2.5">NARCEAN</text>
  <text x="100" y="212" font-family="'Courier New', Courier, monospace" font-size="7.5"
        fill="#27a85c" text-anchor="middle" letter-spacing="2">TECHNOLOGIES</text>
</svg>
