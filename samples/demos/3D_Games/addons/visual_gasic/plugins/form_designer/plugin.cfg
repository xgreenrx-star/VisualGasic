[plugin]
name="Form Designer"
description="VB6-style visual form designer. Drag controls onto a canvas, set properties, and wire up events. Auto-enabled when the project contains .frm or .vgform files."
script="form_designer_plugin.gd"
enabled=true
experimental=true

[capabilities]

provides = ["form_designer"]
handles_extensions = ["frm", "vgform"]
priority = 10
