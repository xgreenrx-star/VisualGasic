    <g font-size="14" fill="#afc2d1">
      <text x="78" y="614">Restore relay links on the outbound crossing.</text>
      <text x="78" y="636">The diagnostic field becomes a hazard behind you.</text>
      <text x="78" y="919">Cyan = valid trace / amber = unresolved link / red = enforcement</text>
