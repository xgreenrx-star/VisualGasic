    <rect x="775" y="545" width="775" height="395" rx="8" fill="#090e19" stroke="#2f4654"/>
    <text x="800" y="577" fill="#79e8ed" font-size="16">03 / BACKLIGHT MATERIAL AND SILHOUETTE RULES</text>
    <g font-size="18" fill="#d2dce7">
      <text x="802" y="627">Opaque graphite panels; broad, readable masses.</text>
      <text x="802" y="669">Recessed wheel drums, not solid glowing discs.</text>
      <text x="802" y="711">Cyan seam light; amber latches and diagnostics.</text>
      <text x="802" y="753">Offset work lamp; separate rear field projector.</text>
      <text x="802" y="795">Red remote unit uses the same maintenance chassis.</text>
      <text x="802" y="837">Tall walls, crisp turns, sparse floor references.</text>
    </g>
