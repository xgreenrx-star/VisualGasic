    <text x="458" y="223" fill="#7de9ed" font-size="10" letter-spacing="4">ISOLATION / 04</text>
    <text x="73" y="174" fill="#93b6c8" font-size="14">01 / VAULT COMPOSITION / ENTRANCE VIEW</text>
    <text x="73" y="730" fill="#9fb4c4" font-size="14">Opaque architecture / narrow glass strips / cyan standby / amber isolation</text>
    <rect x="1040" y="140" width="510" height="620" fill="#0a111c" stroke="#344c5c"/>
    <text x="1065" y="175" fill="#7ee7ee" font-size="16">02 / FEB / PROPOSED 2.65 M</text>
    <use xlink:href="#feb" transform="translate(1280 264) scale(1.03)"/>
    <path d="M1103 246V643M1095 246H1111M1095 643H1111" stroke="#5a768b"/>
    <text x="1063" y="694" fill="#b1c1d1" font-size="15">Service hand + integrated thermal emitter.</text>
    <text x="1063" y="722" fill="#b1c1d1" font-size="15">A damaged guardian, not a faceless monster.</text>
    <g font-size="16">
      <rect x="50" y="790" width="480" height="160" rx="5" fill="#0c1621" stroke="#3c626e"/>
      <text x="72" y="822" fill="#7de9ed" letter-spacing="2">STANDBY / INVESTIGATE</text>
      <text x="72" y="858" fill="#b9c8d6">Cold seams. Closed cradle. Motionless hands.</text>
      <text x="72" y="887" fill="#b9c8d6">Reserve cores sit outside the service interlock.</text>
      <text x="72" y="916" fill="#b9c8d6">Coupler console faces the escape route.</text>
      <rect x="560" y="790" width="480" height="160" rx="5" fill="#1b1715" stroke="#9d773c"/>
      <text x="582" y="822" fill="#ffb34c" letter-spacing="2">ISOLATION LOST / 255</text>
      <text x="582" y="858" fill="#d3c7b6">Amber pulses. Clamps release in sequence.</text>
      <text x="582" y="887" fill="#d3c7b6">Vents spill low mist; head lifts toward Jason.</text>
      <text x="582" y="916" fill="#d3c7b6">Checkpoint before pickup. Orac stays online.</text>
      <rect x="1070" y="790" width="480" height="160" rx="5" fill="#20131e" stroke="#8e4958"/>
      <text x="1092" y="822" fill="#ff7585" letter-spacing="2">REMOTE ENFORCEMENT / RETURN</text>
      <text x="1092" y="858" fill="#d7beca">FEB remains underground during the chase.</text>
      <text x="1092" y="887" fill="#d7beca">An unmanned red cycle pursues Jason.</text>
      <text x="1092" y="916" fill="#d7beca">Its destruction never kills or resurrects FEB.</text>
    </g>
    <text x="50" y="977" fill="#788c9e" font-size="13">ORIGINAL VECTOR CONCEPT / NOT THE RECOVERED USER REFERENCE / NO FINAL CHARACTER OR GAMEPLAY APPROVAL IMPLIED</text>
