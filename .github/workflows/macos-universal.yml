name: macOS Universal Binary

on:
  push:
    branches: [main]
    paths:
      - 'src/**'
      - 'SConstruct'
      - 'godot-cpp/**'
      - 'scripts/build_macos_universal.sh'
      - '.github/workflows/macos-universal.yml'
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  build-macos-slices:
    runs-on: ${{ matrix.arch == 'arm64' && 'macos-latest' || 'macos-15-intel' }}
    strategy:
      matrix:
        target: [editor, template_debug, template_release]
        arch: [arm64, x86_64]

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install SCons
        run: pip install scons

      - name: Install libffi (for VGNativeLibrary FFI support)
        run: brew install libffi

      - name: Install libopenmpt (for Tracker namespace — .xm/.mod/.s3m playback)
        run: brew install libopenmpt

      - name: Build architecture slice
        run: |
          export PKG_CONFIG_PATH="$(brew --prefix libffi)/lib/pkgconfig:$(brew --prefix libopenmpt)/lib/pkgconfig:$(brew --prefix)/lib/pkgconfig:$PKG_CONFIG_PATH"
          scons target=${{ matrix.target }} platform=macos arch=${{ matrix.arch }} -j"$(sysctl -n hw.logicalcpu)"

      - name: Verify architecture slice
        run: |
          FRAMEWORK="demo/bin/libvisualgasic.macos.${{ matrix.target }}.framework"
          DYLIB="$FRAMEWORK/libvisualgasic.macos.${{ matrix.target }}"
          echo "Checking: $DYLIB"
          lipo -info "$DYLIB"
          file "$DYLIB"
          lipo "$DYLIB" -verify_arch "${{ matrix.arch }}"
          echo "PASS: ${{ matrix.arch }} slice built"

      - name: Upload architecture slice
        uses: actions/upload-artifact@v4
        with:
          name: macos-${{ matrix.target }}-${{ matrix.arch }}-slice
          path: demo/bin/libvisualgasic.macos.${{ matrix.target }}.framework/libvisualgasic.macos.${{ matrix.target }}
          retention-days: 30

  # M7 close-out: Python bridge e2e on macOS (editor framework only).
  m7-python-smoke:
    needs: package-universal
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Download editor framework artifact
        uses: actions/download-artifact@v4
        with:
          name: macos-editor-framework
          path: demo/bin/libvisualgasic.macos.editor.framework

      - name: Materialize GDExtension into test_proj
        run: |
          mkdir -p addons/visual_gasic/bin test_proj/addons/visual_gasic/bin
          rm -rf addons/visual_gasic/bin/libvisualgasic.macos.editor.framework
          cp -R demo/bin/libvisualgasic.macos.editor.framework addons/visual_gasic/bin/
          if [ -L test_proj/addons/visual_gasic ] || [ ! -d test_proj/addons/visual_gasic ]; then
            rm -rf test_proj/addons/visual_gasic
            mkdir -p test_proj/addons/visual_gasic
            cp -a addons/visual_gasic/. test_proj/addons/visual_gasic/
          fi
          rm -rf test_proj/addons/visual_gasic/bin/libvisualgasic.macos.editor.framework
          cp -R demo/bin/libvisualgasic.macos.editor.framework test_proj/addons/visual_gasic/bin/
          mkdir -p test_proj/.godot
          echo 'res://addons/visual_gasic/visual_gasic.gdextension' > test_proj/.godot/extension_list.cfg

      - name: Download Godot 4.6.1 (macOS)
        run: |
          curl -L -o godot.zip "https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_macos.universal.zip"
          unzip -q godot.zip
          # App bundle → console-friendly binary path used by run_test_suite.sh
          GODOT_APP="$(find . -maxdepth 3 -name 'Godot' -type f | head -1)"
          test -n "$GODOT_APP"
          chmod +x "$GODOT_APP"
          echo "GODOT=$GODOT_APP" >> "$GITHUB_ENV"

      - name: M7 Python bridge smoke (macOS)
        env:
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          python3 -m pip install -q numpy
          VENV="${{ runner.temp }}/vg-m7-venv-mac"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q numpy
          export VIRTUAL_ENV="$VENV"
          export PATH="$VENV/bin:$PATH"
          chmod +x ./run_test_suite.sh
          for t in test_py_msgpack_typed.vg test_py_range_int.vg test_py_large_array.vg test_py_await.vg; do
            ./run_test_suite.sh "$t"
          done

  package-universal:
    needs: build-macos-slices
    runs-on: macos-latest
    steps:
      - name: Download architecture slices
        uses: actions/download-artifact@v4
        with:
          pattern: macos-*-slice
          path: slices

      - name: Combine slices and package
        run: |
          set -euo pipefail
          mkdir -p release/macos/bin
          for target in editor template_debug template_release; do
            dylib="libvisualgasic.macos.${target}"
            arm_slice="slices/macos-${target}-arm64-slice/$dylib"
            x86_slice="slices/macos-${target}-x86_64-slice/$dylib"
            framework="release/macos/bin/libvisualgasic.macos.${target}.framework"
            universal="$framework/$dylib"
            test -f "$arm_slice"
            test -f "$x86_slice"
            mkdir -p "$framework"
            lipo -create "$arm_slice" "$x86_slice" -output "$universal"
            codesign --force --sign - --deep "$framework" 2>/dev/null || true
            lipo -info "$universal"
            lipo "$universal" -verify_arch arm64 x86_64
            echo "Packaged universal framework: $framework"
          done
          cd release && zip -r ../VisualGasic-macos-universal.zip macos/

      - name: Upload editor framework
        uses: actions/upload-artifact@v4
        with:
          name: macos-editor-framework
          path: release/macos/bin/libvisualgasic.macos.editor.framework/
          retention-days: 30

      - name: Upload template_debug framework
        uses: actions/upload-artifact@v4
        with:
          name: macos-template_debug-framework
          path: release/macos/bin/libvisualgasic.macos.template_debug.framework/
          retention-days: 30

      - name: Upload template_release framework
        uses: actions/upload-artifact@v4
        with:
          name: macos-template_release-framework
          path: release/macos/bin/libvisualgasic.macos.template_release.framework/
          retention-days: 30

      - name: Upload Release Package
        uses: actions/upload-artifact@v4
        with:
          name: VisualGasic-macos-universal
          path: VisualGasic-macos-universal.zip
          retention-days: 90
