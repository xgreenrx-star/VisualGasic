name: Plugin Lint & Routing Tests

# Lightweight job — no GDExtension build, just runs the Python lint
# script and the GDScript routing test suite against a fresh Godot
# binary. Catches plugin.cfg drift and breakage in
# VGAssetBus / VGContextBroker / VGPluginRegistry on every push.

on:
  push:
    branches: [ main, master ]
    paths:
      - 'addons/visual_gasic/**'
      - 'scripts/lint_plugin_capabilities.py'
      - 'scripts/run_routing_tests.sh'
      - 'scripts/sync_addons.sh'
      - 'scripts/ci_smoke.sh'
      - 'tests/test_vg_routing.gd'
      - '.github/workflows/plugin-lint.yml'
  pull_request:
    branches: [ main, master ]
    paths:
      - 'addons/visual_gasic/**'
      - 'scripts/lint_plugin_capabilities.py'
      - 'scripts/run_routing_tests.sh'
      - 'scripts/sync_addons.sh'
      - 'scripts/ci_smoke.sh'
      - 'tests/test_vg_routing.gd'
      - '.github/workflows/plugin-lint.yml'

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Plugin capability lint
        run: |
          chmod +x scripts/lint_plugin_capabilities.py
          python3 scripts/lint_plugin_capabilities.py --strict

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64

      - name: Run routing tests
        run: |
          chmod +x scripts/run_routing_tests.sh
          ./scripts/run_routing_tests.sh

      - name: Addon symlink drift check
        # Canonical addon is addons/visual_gasic. Any drift in the ~30 live
        # copies under demos/, examples/, game_projects/, test_proj/ makes
        # bug reports unreproducible. Fail the build if anything diverged.
        run: |
          chmod +x scripts/sync_addons.sh
          ./scripts/sync_addons.sh check

      - name: Headless smoke (test_proj)
        # Boots the editor headless against test_proj and fails on any
        # Parse Error / SCRIPT ERROR. Cheap regression net for GDScript
        # changes inside addons/visual_gasic.
        run: |
          chmod +x scripts/ci_smoke.sh
          ./scripts/ci_smoke.sh
