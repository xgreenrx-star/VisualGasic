name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  gates:
    uses: ./.github/workflows/ci.yml

  build-linux:
    runs-on: ubuntu-22.04
    strategy:
      matrix:
        target: [editor, template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential libffi-dev libopenmpt-dev pkg-config
      - name: Build
        run: scons platform=linux target=${{ matrix.target }} -j2
      - uses: actions/upload-artifact@v4
        with:
          name: release-linux-${{ matrix.target }}
          path: demo/bin/libvisualgasic.linux.${{ matrix.target }}.x86_64.so
          if-no-files-found: error

  build-windows:
    runs-on: windows-latest
    strategy:
      matrix:
        target: [editor, template_debug, template_release]
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SCons
        run: pip install scons
      - name: Build
        shell: pwsh
        run: scons platform=windows target=${{ matrix.target }} "-j$($env:NUMBER_OF_PROCESSORS)"
      - uses: actions/upload-artifact@v4
        with:
          name: release-windows-${{ matrix.target }}
          path: demo/bin/libvisualgasic.windows.${{ matrix.target }}.x86_64.dll
          if-no-files-found: error

  build-macos:
    uses: ./.github/workflows/macos-universal.yml

  build-web:
    uses: ./.github/workflows/build-web-gdextension.yml

  build-music:
    strategy:
      matrix:
        include:
          - platform: linux
            runner: ubuntu-22.04
            arch: x86_64
          - platform: windows
            runner: windows-latest
            arch: x86_64
          - platform: macos
            runner: macos-latest
            arch: universal
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install SCons
        run: pip install scons
      - name: Fetch pinned music source and apply lifetime repair
        shell: bash
        run: |
          git clone https://github.com/YuriSizov/gdsion vendor/gdsion
          git -C vendor/gdsion checkout 4460364ea6dfdd625f4e15f1ec95e06e417bf2b7
          git -C vendor/gdsion config -f .gitmodules submodule.godot-cpp.url https://github.com/godotengine/godot-cpp.git
          git -C vendor/gdsion submodule sync
          git -C vendor/gdsion submodule update --init --recursive
      - name: Build patched music library
        shell: bash
        env:
          PLATFORM: ${{ matrix.platform }}
          ARCH: ${{ matrix.arch }}
          JOBS: '3'
        run: |
          bash addons/visual_gasic/plugins/vgmusic/build_gdsion.sh template_debug template_release
          cp vendor/gdsion/LICENSE addons/visual_gasic/plugins/vgmusic/bin/LICENSE
      - uses: actions/upload-artifact@v4
        with:
          name: release-music-${{ matrix.platform }}
          path: addons/visual_gasic/plugins/vgmusic/bin/
          if-no-files-found: error

  package:
    needs: [gates, build-linux, build-windows, build-macos, build-web, build-music]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check candidate identity
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          test -f "RELEASE_NOTES_v${version}.md"
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            test "$GITHUB_REF_NAME" = "v${version}"
          fi
          mkdir -p addons/visual_gasic/bin
      - uses: actions/download-artifact@v4
        with:
          pattern: release-linux-*
          path: addons/visual_gasic/bin
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          pattern: release-windows-*
          path: addons/visual_gasic/bin
          merge-multiple: true
      - uses: actions/download-artifact@v4
        with:
          name: macos-editor-framework
          path: addons/visual_gasic/bin/libvisualgasic.macos.editor.framework
      - uses: actions/download-artifact@v4
        with:
          name: macos-template_debug-framework
          path: addons/visual_gasic/bin/libvisualgasic.macos.template_debug.framework
      - uses: actions/download-artifact@v4
        with:
          name: macos-template_release-framework
          path: addons/visual_gasic/bin/libvisualgasic.macos.template_release.framework
      - uses: actions/download-artifact@v4
        with:
          name: visualgasic-web-wasm
          path: addons/visual_gasic/bin
      - uses: actions/download-artifact@v4
        with:
          pattern: release-music-*
          path: addons/visual_gasic/plugins/vgmusic/bin
          merge-multiple: true
      - name: Install packaging and smoke dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y nsis rsync unzip zip libffi-dev libopenmpt-dev python3-tk
          curl -fL --retry 3 -o godot.zip https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q godot.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64 addons/visual_gasic/bin/*.so
      - name: Package all downloads
        env:
          APPIMAGE_EXTRACT_AND_RUN: '1'
        run: bash scripts/package_release_candidate.sh
      - name: Smoke test packaged Asset Library archive
        run: bash scripts/test_release_archive.sh
      - uses: actions/upload-artifact@v4
        with:
          name: release-downloads
          path: |
            release/v*/*.zip
            release/v*/*.exe
            release/v*/VisualGasic-Installer-v*-x86_64.AppImage
            release/v*/SHA256SUMS
            release/v*/BUILD_COMMIT.txt
            release/v*/asset-smoke.log
          if-no-files-found: error
      - name: Create draft beta release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version="$(tr -d '[:space:]' < VERSION)"
          existing="$(gh api --paginate "repos/${GITHUB_REPOSITORY}/releases" \
            --jq ".[] | select(.tag_name == \"v${version}\") | .html_url")"
          if [[ -n "$existing" ]]; then
            echo "Release already exists; preserving its assets and publication state: $existing"
            exit 0
          fi
          args=()
          [[ "$version" == *-* ]] && args+=(--prerelease)
          if [[ "$GITHUB_REF" == refs/tags/* ]]; then
            args+=(--verify-tag)
          else
            args+=(--target "$GITHUB_SHA")
          fi
          gh release create "v${version}" --draft "${args[@]}" \
            --title "VisualGasic v${version} — Core fixes, DATA sprite editing and Crystal Caverns" \
            --notes-file "RELEASE_NOTES_v${version}.md" \
            release/v${version}/*.zip release/v${version}/*.exe \
            release/v${version}/VisualGasic-Installer-v${version}-x86_64.AppImage release/v${version}/SHA256SUMS \
            release/v${version}/BUILD_COMMIT.txt
