name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3 python3-pip libopenmpt-dev pkg-config

      - name: Dim linter
        run: |
          chmod +x ./scripts/check_dim_types.py
          ./scripts/check_dim_types.py

      - name: Addon sync check
        run: |
          chmod +x ./scripts/sync_addons.sh
          ./scripts/sync_addons.sh check

      - name: Build
        run: scons platform=linux target=editor -j2

      - name: Prepare GDExtension for testing
        run: |
          chmod +x ./scripts/prepare_ci_gdextension.sh
          ./scripts/prepare_ci_gdextension.sh

      - name: Verify GDExtension smoke load
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
        run: |
          echo "res://test_suite/test_arr_simple.vg" > test_proj/current_test.txt
          out=$(timeout 30 "$GODOT" --headless --path test_proj --user-data-dir "$VG_GODOT_USER_DATA_DIR" -s run_suite.gd 2>&1) || true
          echo "$out" | tail -20
          echo "$out" | grep -q "^PASS:"

      - name: Run VisualGasic test suite (.vg)
        timeout-minutes: 15
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          chmod +x ./run_test_suite.sh
          ./run_test_suite.sh --vg-only

      - name: Run smoke tests
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_SKIP_SCONS: "1"
        run: |
          chmod +x ./tests/run_smoke_tests.py
          ./tests/run_smoke_tests.py

      - name: Run builtin tests
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_SKIP_SCONS: "1"
        run: |
          chmod +x ./tests/run_builtin_tests.py
          ./tests/run_builtin_tests.py

      - name: Programmer's Reference gate (audit + parse harness)
        env:
          DISPLAY: ""
        run: |
          chmod +x ./scripts/run_command_reference_gate.sh
          ./scripts/run_command_reference_gate.sh

      - name: Asset Library install smoke
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
        run: |
          chmod +x ./scripts/run_asset_library_smoke.sh
          ./scripts/run_asset_library_smoke.sh

      - name: Benchmark regression (VG must beat GDScript)
        timeout-minutes: 10
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          MAX_RATIO: "1.15"
        run: |
          chmod +x ./scripts/benchmark_regression_check.sh \
            ./scripts/run_compute_benchmarks.sh \
            ./scripts/run_draw_benchmarks.sh
          ./scripts/benchmark_regression_check.sh

      - name: Capture bytecode dump
        env:
          DISPLAY: ""
        run: |
          ./Godot_v4.6.1-stable_linux.x86_64 --headless --path demo \
            --script dump_bytecode.gd \
            --entries=BenchArithmetic,BenchArraySum,BenchStringConcat,BenchBranch \
            --json --out=${{ github.workspace }}/bytecode_dump.json

      - name: Compare bytecode dump to baseline
        id: compare_release
        continue-on-error: true
        run: python3 scripts/compare_bytecode_dump.py tests/bytecode_baseline.json bytecode_dump.json --diff-output bytecode_diff_release.txt

      - name: Comment bytecode diff on PR
        if: github.event_name == 'pull_request' && steps.compare_release.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Bytecode baseline differences detected in this PR.\n\n';
            const diffPath = 'bytecode_diff_release.txt';
            if (fs.existsSync(diffPath)) {
              const content = fs.readFileSync(diffPath, 'utf8').trim();
              if (content) {
                body += `\`\`\`diff\n${content}\n\`\`\`\n\n`;
              } else {
                body += '_Diff output was empty._\n\n';
              }
            } else {
              body += '_Diff output was not captured._\n\n';
            }
            body += 'See README.md for bytecode baseline refresh instructions.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on bytecode mismatches
        if: steps.compare_release.outcome == 'failure'
        run: |
          echo "Bytecode dump differs from baseline"
          exit 1

      - name: Upload bytecode dump artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bytecode-dump
          path: |
            bytecode_dump.json
            bytecode_diff_release.txt

  # -------------------------------------------------------------------------
  # Windows cross-compilation check (MinGW)
  # -------------------------------------------------------------------------
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3 g++-mingw-w64-x86-64 libopenmpt-dev pkg-config

      - name: Build (Windows template_debug)
        run: scons platform=windows target=template_debug -j$(nproc)

  # -------------------------------------------------------------------------
  # Windows native build + test (MSVC)
  # -------------------------------------------------------------------------
  build-windows-native:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      - name: Build (Windows template_debug, MSVC)
        shell: pwsh
        run: |
          scons platform=windows target=template_debug "-j$($env:NUMBER_OF_PROCESSORS)"

      - name: Build (Windows template_release, MSVC)
        shell: pwsh
        run: |
          scons platform=windows target=template_release "-j$($env:NUMBER_OF_PROCESSORS)"
