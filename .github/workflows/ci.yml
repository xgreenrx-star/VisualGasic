name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_call:

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Download Godot 4.6.1
        run: |
          wget -q https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          unzip -q Godot_v4.6.1-stable_linux.x86_64.zip
          chmod +x Godot_v4.6.1-stable_linux.x86_64

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3 python3-pip libopenmpt-dev pkg-config gdb

      - name: Dim linter
        run: |
          chmod +x ./scripts/check_dim_types.py
          ./scripts/check_dim_types.py

      - name: Addon sync check
        run: |
          chmod +x ./scripts/sync_addons.sh
          ./scripts/sync_addons.sh check

      - name: Build
        run: |
          scons platform=linux target=template_debug -j2
          scons platform=linux target=editor -j2

      - name: Prepare GDExtension for testing
        run: |
          chmod +x ./scripts/prepare_ci_gdextension.sh
          ./scripts/prepare_ci_gdextension.sh

      - name: Verify GDExtension smoke load
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
        run: |
          echo "res://test_suite/test_arr_simple.vg" > test_proj/current_test.txt
          out=$(timeout 30 "$GODOT" --headless --path test_proj --user-data-dir "$VG_GODOT_USER_DATA_DIR" -s run_suite.gd 2>&1) || true
          echo "$out" | tail -20
          echo "$out" | grep -q "^PASS:"

      - name: M8 FFI smoke (Linux Declare / libc)
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          chmod +x ./run_test_suite.sh
          ./run_test_suite.sh test_declare_ffi.vg
          ./run_test_suite.sh test_dllimport_ffi.vg

      - name: M7 Python bridge (json-safe, venv, large-array lane)
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          python3 scripts/test_python_numpy_json_safe.py
          VENV="${{ runner.temp }}/vg-m7-venv"
          python3 -m venv "$VENV"
          "$VENV/bin/pip" install -q numpy
          export VIRTUAL_ENV="$VENV"
          chmod +x ./run_test_suite.sh
          for t in test_py_msgpack_typed.vg test_py_await.vg test_py_range_int.vg test_py_large_array.vg; do
            ./run_test_suite.sh "$t"
          done
          echo "res://test_suite/test_py_large_array.vg" > test_proj/current_test.txt
          out=$(timeout 40 "$GODOT" --headless --path test_proj --user-data-dir "$VG_GODOT_USER_DATA_DIR" -s run_suite.gd 2>&1) || true
          echo "$out" | tail -30
          echo "$out" | grep -q "PASS: test_py_large_array"
          echo "$out" | grep -q "vg-m7-venv"

      - name: M8 language parity (Let, lambda, optional ?.)
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          chmod +x ./run_test_suite.sh
          for t in test_let_block_scope.vg test_lambda.vg test_lambda_block.vg test_optional_chaining.vg test_optional_chain_deep.vg test_named_args.vg test_try_cross_module.vg; do
            ./run_test_suite.sh "$t"
          done

      - name: Run VisualGasic test suite (.vg)
        timeout-minutes: 15
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          chmod +x ./run_test_suite.sh
          ./run_test_suite.sh --vg-only

      - name: Run smoke tests
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_SKIP_SCONS: "1"
        run: |
          chmod +x ./tests/run_smoke_tests.py
          ./tests/run_smoke_tests.py

      - name: Run builtin tests
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_SKIP_SCONS: "1"
        run: |
          chmod +x ./tests/run_builtin_tests.py
          ./tests/run_builtin_tests.py

      - name: Release hardening (parity, corpus, mutations, editor lifecycle)
        id: release-hardening
        timeout-minutes: 25
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          OUT_DIR: ${{ runner.temp }}/vg-release-hardening
        run: bash scripts/run_release_hardening.sh

      - name: Diagnose fresh editor imports after hardening failure
        if: ${{ failure() && steps.release-hardening.outcome == 'failure' }}
        timeout-minutes: 6
        continue-on-error: true
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          OUT_DIR: ${{ runner.temp }}/vg-release-hardening/editor-reload-backtrace
          IMPORT_BACKTRACE: "1"
        run: bash scripts/run_editor_reload_regression.sh

      - name: Upload release hardening evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: linux-release-hardening
          path: ${{ runner.temp }}/vg-release-hardening
          if-no-files-found: warn

      - name: Programmer's Reference gate (audit + parse harness)
        env:
          DISPLAY: ""
        run: |
          chmod +x ./scripts/run_command_reference_gate.sh
          ./scripts/run_command_reference_gate.sh

      - name: Crystal Caverns DATA and Whenever gameplay
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          OUT_DIR: ${{ runner.temp }}/vg-crystal-caverns
        run: bash scripts/run_crystal_caverns_regression.sh

      - name: Upload Crystal Caverns evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: crystal-caverns-regression
          path: ${{ runner.temp }}/vg-crystal-caverns/*.log
          if-no-files-found: warn

      - name: Asset Library install smoke
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
        run: |
          chmod +x ./scripts/run_asset_library_smoke.sh
          ./scripts/run_asset_library_smoke.sh

      - name: Benchmark regression (VG must beat GDScript)
        timeout-minutes: 10
        env:
          DISPLAY: ""
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_linux.x86_64
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          MAX_RATIO: "1.15"
          DRAW_MAX_RATIO: "1.35"
        run: |
          chmod +x ./scripts/benchmark_regression_check.sh \
            ./scripts/run_compute_benchmarks.sh \
            ./scripts/run_draw_benchmarks.sh
          ./scripts/benchmark_regression_check.sh

      - name: Capture bytecode dump
        env:
          DISPLAY: ""
        run: |
          ./Godot_v4.6.1-stable_linux.x86_64 --headless --path demo \
            --script "${{ github.workspace }}/engine_lab/prototypes/dump_bytecode.gd" \
            --entries=BenchArithmetic,BenchArraySum,BenchStringConcat,BenchBranch \
            --json --out=${{ github.workspace }}/bytecode_dump.json

      - name: Compare bytecode dump to baseline
        id: compare_release
        continue-on-error: true
        run: python3 scripts/compare_bytecode_dump.py tests/bytecode_baseline.json bytecode_dump.json --diff-output bytecode_diff_release.txt

      - name: Comment bytecode diff on PR
        if: github.event_name == 'pull_request' && steps.compare_release.outcome == 'failure'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            let body = 'Bytecode baseline differences detected in this PR.\n\n';
            const diffPath = 'bytecode_diff_release.txt';
            if (fs.existsSync(diffPath)) {
              const content = fs.readFileSync(diffPath, 'utf8').trim();
              if (content) {
                body += `\`\`\`diff\n${content}\n\`\`\`\n\n`;
              } else {
                body += '_Diff output was empty._\n\n';
              }
            } else {
              body += '_Diff output was not captured._\n\n';
            }
            body += 'See README.md for bytecode baseline refresh instructions.';
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body,
            });

      - name: Fail on bytecode mismatches
        if: steps.compare_release.outcome == 'failure'
        run: |
          echo "Bytecode dump differs from baseline"
          exit 1

      - name: Upload bytecode dump artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bytecode-dump
          path: |
            bytecode_dump.json
            bytecode_diff_release.txt

  # -------------------------------------------------------------------------
  # Windows cross-compilation check (MinGW)
  # -------------------------------------------------------------------------
  build-windows:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y scons build-essential python3 g++-mingw-w64-x86-64 libopenmpt-dev pkg-config

      - name: Build (Windows template_debug)
        run: scons platform=windows target=template_debug -j$(nproc)

  # -------------------------------------------------------------------------
  # Windows native build + test (MSVC)
  # -------------------------------------------------------------------------
  build-windows-native:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          lfs: true

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install SCons
        run: pip install scons

      - name: Build (Windows editor, MSVC)
        shell: pwsh
        run: |
          scons platform=windows target=editor "-j$($env:NUMBER_OF_PROCESSORS)"

      - name: Prepare GDExtension for testing
        shell: bash
        run: |
          chmod +x ./scripts/prepare_ci_gdextension_windows.sh
          ./scripts/prepare_ci_gdextension_windows.sh

      - name: Download Godot 4.6.1 (Windows)
        shell: pwsh
        run: |
          $zip = "Godot_v4.6.1-stable_win64.exe.zip"
          Invoke-WebRequest -Uri "https://github.com/godotengine/godot/releases/download/4.6.1-stable/$zip" -OutFile $zip
          Expand-Archive -Path $zip -DestinationPath . -Force
          Get-ChildItem Godot_v4.6.1-stable_win64*.exe | Select-Object -ExpandProperty Name

      - name: M8 FFI smoke (Windows Declare / ucrtbase + kernel32)
        shell: bash
        env:
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_win64_console.exe
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          chmod +x ./run_test_suite.sh
          ./run_test_suite.sh test_declare_ffi_windows.vg

      - name: Diagnose Windows GDExtension load failure
        if: failure()
        shell: pwsh
        run: |
          $dll = Join-Path $env:GITHUB_WORKSPACE 'test_proj\addons\visual_gasic\bin\libvisualgasic.windows.editor.x86_64.dll'
          if (-not (Test-Path $dll)) {
            Write-Host "Staged extension DLL not found: $dll"
            exit 0
          }
          Get-Item $dll | Format-List FullName,Length,LastWriteTime
          python -c 'import ctypes,sys; ctypes.WinDLL(sys.argv[1])' $dll
          Write-Host "Isolated LoadLibrary exit code: $LASTEXITCODE"
          $vswhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio\Installer\vswhere.exe'
          if (Test-Path $vswhere) {
            $vsPath = & $vswhere -latest -products '*' -property installationPath
            $dumpbin = Get-ChildItem "$vsPath\VC\Tools\MSVC\*\bin\Hostx64\x64\dumpbin.exe" -File -ErrorAction SilentlyContinue |
              Select-Object -First 1 -ExpandProperty FullName
            if ($dumpbin) {
              & $dumpbin /dependents $dll
              & $dumpbin /exports $dll | Select-String 'visual_gasic_library_init'
            }
          }
          $cdb = Join-Path ${env:ProgramFiles(x86)} 'Windows Kits\10\Debuggers\x64\cdb.exe'
          if (Test-Path $cdb) {
            $python = (Get-Command python).Source
            & $cdb -c 'sxe av; g; k; q' $python -c 'import ctypes,sys; ctypes.WinDLL(sys.argv[1])' $dll
            Write-Host "CDB exit code: $LASTEXITCODE"
          } else {
            Write-Host "CDB is unavailable at $cdb"
          }

      - name: M7 Python bridge smoke (Windows)
        shell: bash
        env:
          GODOT: ${{ github.workspace }}/Godot_v4.6.1-stable_win64_console.exe
          VG_GODOT_USER_DATA_DIR: ${{ runner.temp }}/vg-godot-user
          VG_TEST_SUITE_VG_ONLY: "1"
        run: |
          python -m pip install -q numpy
          VENV="${{ runner.temp }}/vg-m7-venv-win"
          python -m venv "$VENV"
          "$VENV/Scripts/pip.exe" install -q numpy
          export VIRTUAL_ENV="$VENV"
          export PATH="$VENV/Scripts:$PATH"
          chmod +x ./run_test_suite.sh
          for t in test_py_msgpack_typed.vg test_py_range_int.vg test_py_large_array.vg test_py_await.vg; do
            ./run_test_suite.sh "$t"
          done

      - name: Build (Windows template_debug, MSVC)
        shell: pwsh
        run: |
          scons platform=windows target=template_debug "-j$($env:NUMBER_OF_PROCESSORS)"

      - name: Build (Windows template_release, MSVC)
        shell: pwsh
        run: |
          scons platform=windows target=template_release "-j$($env:NUMBER_OF_PROCESSORS)"
