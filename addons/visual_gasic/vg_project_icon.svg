<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <!-- Blue gradient background -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#1e40af;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#3b82f6;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#fff;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#e0e7ff;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Rounded square background -->
  <rect width="256" height="256" rx="32" fill="url(#bgGrad)"/>
  
  <!-- Code brackets left side -->
  <path d="M 60 80 L 40 128 L 60 176" stroke="url(#textGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Code brackets right side -->
  <path d="M 196 80 L 216 128 L 196 176" stroke="url(#textGrad)" stroke-width="6" fill="none" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- VG text in center -->
  <text x="128" y="145" font-family="'Courier New', monospace" font-size="64" font-weight="bold" fill="url(#textGrad)" text-anchor="middle" dominant-baseline="middle">VG</text>
  
  <!-- Accent line under VG -->
  <line x1="90" y1="160" x2="166" y2="160" stroke="url(#textGrad)" stroke-width="3" stroke-linecap="round" opacity="0.8"/>
</svg>