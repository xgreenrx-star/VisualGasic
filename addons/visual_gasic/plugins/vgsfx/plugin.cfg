[plugin]

name="VGSFX"
description="Sound effects generator — native GDScript port of bfxr2 (Bfxr/Transfxr/Footsteppr). Generate retro game SFX, transitions, and footstep sounds. Export WAV directly into AGCK sound slots."
script="vg_vgsfx_plugin.gd"
enabled=false

[capabilities]

provides=["asset_editor.audio.sfx", "asset_generator.audio"]
handles_extensions=["bfxr"]
priority=50
