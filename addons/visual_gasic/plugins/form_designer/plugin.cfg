[plugin]
name="Form Designer"
description="[Alpha / experimental] Legacy VB6-style form canvas entry. Not on the v6.0 stable path — requires vg/enable_experimental_plugins. Prefer UI Forms (2D viewport) for new work. See docs/manual/VG_IDE_ALPHA.md."
script="form_designer_plugin.gd"
enabled=true
experimental=true

[capabilities]

provides = ["form_designer"]
handles_extensions = ["frm", "vgform"]
priority = 10
